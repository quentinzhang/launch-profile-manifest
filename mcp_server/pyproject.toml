[project]
name = "launch-profile-mcp"
version = "0.3.0"
description = "MCP client for the Launch Operations Protocol registry API"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.26,<2"
]

[project.scripts]
launch-profile-mcp = "launch_profile_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
